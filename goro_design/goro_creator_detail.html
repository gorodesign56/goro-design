<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORO DESIGN — クリエイタープロフィール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#0f0f0e;--white:#fafaf8;--g1:#f0efe9;--g2:#d4d1ca;--g3:#8a877f;--g4:#5a5855;--green:#1e5c4e;--green-l:#d6ede6;--bd:2px solid #d4d1ca;--bd-dark:2px solid #0f0f0e;--sans:'Noto Sans JP',sans-serif;--serif:'Shippori Mincho',serif;--w:760px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;font-weight:500}
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:58px;background:var(--white);border-bottom:var(--bd)}
  .logo{font-family:var(--serif);font-size:16px;letter-spacing:.12em;text-decoration:none;color:var(--black);font-weight:600}
  .back-link{font-size:13px;color:var(--g4);text-decoration:none}.back-link:hover{color:var(--black)}
  .hero{padding:72px 40px 56px;border-bottom:var(--bd-dark)}
  .hero-inn{max-width:var(--w);margin:0 auto;display:grid;grid-template-columns:120px 1fr;gap:40px;align-items:center}
  .hero-avatar{width:120px;height:120px;border-radius:50%;background:var(--g1);border:var(--bd-dark);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0}
  .hero-avatar img{width:100%;height:100%;object-fit:cover}
  .hero-type{font-size:11px;letter-spacing:.2em;color:var(--green);margin-bottom:8px;font-weight:500}
  .hero-name{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;margin-bottom:10px}
  .hero-spec{font-size:13px;color:var(--g4);line-height:1.7;font-weight:500;white-space:pre-line}
  .sec{padding:56px 40px}
  .inn{max-width:var(--w);margin:0 auto}
  .sec-ey{font-size:11px;letter-spacing:.22em;color:var(--g3);display:block;margin-bottom:10px;font-weight:400}
  .sec-h{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:20px}
  .div{height:2px;background:var(--g2);margin:0 40px}
  .bg1{background:var(--g1)}
  .bio-text{font-size:14px;color:var(--g4);line-height:2;font-weight:500}
  .works-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .work-img{aspect-ratio:1;overflow:hidden;background:var(--g1);border:var(--bd)}
  .work-img img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform-origin:center}
  .no-works{font-size:13px;color:var(--g3);font-weight:500;padding:20px 0}
  .links-grid{display:flex;flex-direction:column;gap:12px}
  .link-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border:var(--bd);text-decoration:none;color:var(--black);transition:background .15s}
  .link-item:hover{background:var(--g1)}
  .link-icon{font-size:20px;flex-shrink:0}
  .link-label{font-size:11px;letter-spacing:.1em;color:var(--g3);margin-bottom:2px;font-weight:500}
  .link-url{font-size:13px;color:var(--black);font-weight:400}
  .link-arr{margin-left:auto;font-size:14px;color:var(--g3)}
  .no-links{font-size:13px;color:var(--g3);font-weight:500;padding:20px 0}
  /* CTA */
  .cta-box{background:var(--black);color:var(--white);padding:48px 40px;text-align:center}
  .cta-h{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:10px;color:var(--white)}
  .cta-p{font-size:13px;color:#888;margin-bottom:28px;font-weight:500}
  .cta-btn{display:inline-block;padding:14px 36px;background:var(--white);color:var(--black);text-decoration:none;font-size:14px;font-weight:500;transition:opacity .15s;border:none;cursor:pointer;font-family:var(--sans)}
  .cta-btn:hover{opacity:.85}
  /* NOT FOUND */
  .not-found{padding:80px 40px;text-align:center}
  .not-found h2{font-family:var(--serif);font-size:22px;margin-bottom:12px}
  .not-found p{font-size:14px;color:var(--g4);margin-bottom:24px}
  .not-found a{color:var(--green);text-decoration:none;font-size:14px}
  footer{padding:28px 40px;border-top:var(--bd-dark);display:flex;justify-content:space-between;align-items:center}
  .fl-logo{font-family:var(--serif);font-size:15px;letter-spacing:.1em;font-weight:600}
  .fl-copy{font-size:12px;color:var(--g3);font-weight:500}

  /* ===== INQUIRY MODAL ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{background:var(--white);max-width:520px;width:100%;padding:40px 36px;position:relative}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--g3);line-height:1}
  .modal-close:hover{color:var(--black)}
  .modal-ey{font-size:11px;letter-spacing:.22em;color:var(--g3);display:block;margin-bottom:8px;font-weight:400}
  .modal-h{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
  .modal-sub{font-size:13px;color:var(--g4);margin-bottom:28px;line-height:1.7}
  .modal-field{margin-bottom:16px}
  .modal-label{display:block;font-size:11px;color:var(--g3);margin-bottom:6px;letter-spacing:.08em;font-weight:500}
  .modal-input,.modal-textarea{width:100%;font-size:14px;padding:11px 14px;border:var(--bd);background:var(--white);font-family:var(--sans);outline:none;color:var(--black);border-radius:0;-webkit-appearance:none}
  .modal-input:focus,.modal-textarea:focus{border-color:var(--black)}
  .modal-textarea{height:100px;resize:none}
  .modal-send{width:100%;padding:14px;font-size:14px;font-weight:500;background:var(--black);color:var(--white);border:none;cursor:pointer;font-family:var(--sans);margin-top:8px;transition:opacity .15s}
  .modal-send:hover{opacity:.8}
  .modal-note{font-size:11px;color:var(--g3);margin-top:10px;text-align:center}
  .modal-done{display:none;text-align:center;padding:20px 0}
  .modal-done p{font-size:14px;color:var(--g4);line-height:1.8}

  @media(max-width:600px){
    nav{padding:0 20px}.hero,.sec{padding:48px 20px}.div{margin:0 20px}
    .hero-inn{grid-template-columns:80px 1fr;gap:20px}
    .hero-avatar{width:80px;height:80px;font-size:28px}
    .works-gallery{grid-template-columns:repeat(2,1fr)}
    footer{flex-direction:column;gap:12px;text-align:center}
    .cta-box{padding:40px 20px}
    .modal-box{padding:28px 20px}
  }
</style>
<script src="goro_data.js" onerror=""></script>
</head>
<body>

<nav>
  <a class='back-link' href='goro_creators.html'>← クリエイター一覧</a>
  <a href="/" class="logo">GORO DESIGN</a>
  <span style="width:120px"></span>
</nav>

<div id="creator-content"></div>

<footer>
  <span class="fl-logo">GORO DESIGN</span>
  <span class="fl-copy">Copyright 2026 gorodesign</span>
</footer>

<!-- INQUIRY MODAL -->
<div class="modal-overlay" id="inquiry-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModalDirect()">×</button>
    <span class="modal-ey">INQUIRY</span>
    <h2 class="modal-h">クリエイターへの依頼</h2>
    <p class="modal-sub" id="modal-creator-label">内容をご記入ください。ゴローデザインが窓口となってご連絡します。</p>
    <form id="inquiry-form" action="https://formspree.io/f/xkoydkgb" method="POST" onsubmit="handleInquirySubmit(event)">
      <input type="hidden" name="件名" id="modal-subject" value="">
      <div class="modal-field">
        <label class="modal-label">お名前</label>
        <input class="modal-input" type="text" name="お名前" placeholder="山田 太郎" required>
      </div>
      <div class="modal-field">
        <label class="modal-label">メールアドレス</label>
        <input class="modal-input" type="email" name="メールアドレス" placeholder="example@mail.com" required>
      </div>
      <div class="modal-field">
        <label class="modal-label">依頼内容</label>
        <textarea class="modal-textarea" name="依頼内容" placeholder="ご依頼の概要をお書きください。" required></textarea>
      </div>
      <button class="modal-send" type="submit">送信する →</button>
      <p class="modal-note">ゴローデザインより2〜3営業日以内にご連絡します</p>
    </form>
    <div class="modal-done" id="modal-done">
      <p>送信しました。<br>2〜3営業日以内にご連絡します。</p>
    </div>
  </div>
</div>

<script>
function openInquiry(name){
  document.getElementById('modal-subject').value = '【クリエイター依頼】' + name;
  document.getElementById('modal-creator-label').textContent = '「' + name + '」への依頼内容をご記入ください。ゴローデザインが窓口となってご連絡します。';
  document.getElementById('inquiry-form').style.display = 'block';
  document.getElementById('modal-done').style.display = 'none';
  document.getElementById('inquiry-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e){
  if(e.target === document.getElementById('inquiry-modal')) closeModalDirect();
}
function closeModalDirect(){
  document.getElementById('inquiry-modal').classList.remove('open');
  document.body.style.overflow = '';
}
async function handleInquirySubmit(e){
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  try {
    const res = await fetch(form.action, {method:'POST', body:data, headers:{Accept:'application/json'}});
    if(res.ok){
      form.style.display = 'none';
      document.getElementById('modal-done').style.display = 'block';
      setTimeout(closeModalDirect, 3000);
    } else { alert('送信に失敗しました。再度お試しください。'); }
  } catch { alert('送信に失敗しました。再度お試しください。'); }
}

function render(){
  const raw=localStorage.getItem('goro_viewing_creator');
  const el=document.getElementById('creator-content');
  if(!raw){
    el.innerHTML=`<div class="not-found"><h2>データが見つかりません</h2><p>一度クリエイター一覧に戻ってください。</p><a href="goro_creators.html">← クリエイター一覧に戻る</a></div>`;
    return;
  }
  const c=JSON.parse(raw);
  document.title=`GORO DESIGN — ${c.name}`;

  const av=c.avatar?`<div class="hero-avatar"><img src="${c.avatar}" alt="${c.name}"></div>`:`<div class="hero-avatar">${c.emoji||'👤'}</div>`;
  let html=`<section class="hero"><div class="hero-inn">${av}<div><p class="hero-type">${c.type||''}</p><h1 class="hero-name">${c.name}</h1><p class="hero-spec">${c.spec||''}</p></div></div></section><div class="div"></div>`;

  if(c.bio){
    html+=`<section class="sec"><div class="inn"><span class="sec-ey">ABOUT</span><h2 class="sec-h">自己紹介</h2><p class="bio-text">${c.bio.replace(/\n/g,'<br>')}</p></div></section><div class="div"></div>`;
  }

  html+=`<section class="sec bg1"><div class="inn"><span class="sec-ey">WORKS</span><h2 class="sec-h">作品</h2>`;
  if(c.works&&c.works.length){
    html+=`<div class="works-gallery">`;
    c.works.forEach(w=>{
      const n = (typeof w==='string') ? {img:w,x:50,y:50,z:100,fit:false}
              : {img:w.img, x:(w.x==null?50:w.x), y:(w.y==null?50:w.y), z:(w.z==null?100:w.z), fit:!!w.fit};
      html+=`<div class="work-img"><img src="${n.img}" style="object-fit:${n.fit?'contain':'cover'};object-position:${n.x}% ${n.y}%;transform:scale(${n.z/100})" loading="lazy"></div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<p class="no-works">作品画像は準備中です。</p>`;
  }
  html+=`</div></section><div class="div"></div>`;

  const hasLinks=c.instagram||c.twitter||c.link;
  html+=`<section class="sec"><div class="inn"><span class="sec-ey">LINKS</span><h2 class="sec-h">SNS・ポートフォリオ</h2>`;
  if(hasLinks){
    html+=`<div class="links-grid">`;
    if(c.instagram) html+=linkItem('📸','Instagram',c.instagram);
    if(c.twitter)   html+=linkItem('𝕏','X (Twitter)',c.twitter);
    if(c.link)      html+=linkItem('🌐',c.linkText||'ポートフォリオ・HP',c.link);
    html+=`</div>`;
  } else {
    html+=`<p class="no-links">リンクは準備中です。</p>`;
  }
  html+=`</div></section>`;

  html+=`<div class="cta-box"><p class="cta-h">${c.name}への依頼はゴローデザインへ</p><p class="cta-p">ARデザインのご相談・クリエイターへの案件はお気軽にどうぞ。</p><button class="cta-btn" onclick="openInquiry('${c.name.replace(/'/g,"\\'")}')">このクリエイターに依頼する →</button></div>`;

  el.innerHTML=html;
}

function linkItem(icon,label,url){
  const display=url.replace(/https?:\/\//,'').replace(/\/$/,'');
  return `<a href="${url}" target="_blank" class="link-item"><span class="link-icon">${icon}</span><div><p class="link-label">${label}</p><p class="link-url">${display}</p></div><span class="link-arr">→</span></a>`;
}

render();
</script>
</body>
</html>
