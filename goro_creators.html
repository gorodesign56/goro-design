<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参加クリエイター一覧 | GORO DESIGN</title>
<meta name="description" content="GORO DESIGNに参加するイラストレーター・デザイナー一覧。ARコンテンツ制作を手がけるクリエイターをご紹介します。大阪を中心に全国対応。">
<meta name="keywords" content="動く名刺,動くデザイン,AR名刺,イラストレーター 大阪,動くポスター,クリエイター 紹介,ゴローデザイン">
<meta property="og:title" content="参加クリエイター一覧 | GORO DESIGN">
<meta property="og:description" content="GORO DESIGNに参加するイラストレーター・デザイナー一覧。ARコンテンツ制作を手がけるクリエイターをご紹介します。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://goro-design.jp/goro_creators.html">
<meta property="og:image" content="https://goro-design.jp/images/case1_after.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--black:#0f0f0e;--white:#fafaf8;--g1:#f0efe9;--g2:#d4d1ca;--g3:#8a877f;--g4:#5a5855;--green:#1e5c4e;--green-l:#d6ede6;--bd:2px solid #d4d1ca;--bd-dark:2px solid #0f0f0e;--sans:'Noto Sans JP',sans-serif;--serif:'Shippori Mincho',serif;--w:1040px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;font-weight:500}
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:58px;background:var(--white);border-bottom:var(--bd)}
  .logo{font-family:var(--serif);font-size:16px;letter-spacing:.12em;text-decoration:none;color:var(--black);font-weight:600}
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-link{font-size:13px;color:var(--g4);text-decoration:none}.nav-link:hover{color:var(--black)}
  .nav-link.on{color:var(--black);font-weight:500}
  .sec{padding:72px 40px}.inn{max-width:var(--w);margin:0 auto}
  .sec-ey{font-size:11px;letter-spacing:.22em;color:var(--g3);display:block;margin-bottom:10px;font-weight:400}
  .sec-h{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:10px}
  .sec-sub{font-size:14px;color:var(--g4);line-height:1.9;font-weight:500;margin-bottom:44px}
  /* CREATORS */
  .cr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:var(--bd-dark);background:var(--g2)}
  .cr-card{background:var(--white);padding:32px 28px;cursor:pointer;transition:background .15s;position:relative}
  .cr-card:hover{background:#f5f4ee}
  .cr-hint{position:absolute;bottom:12px;right:14px;font-size:11px;color:var(--g3);font-weight:500}
  .pag-btn{width:38px;height:38px;border:var(--bd-dark);background:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:400;transition:all .15s}
  .pag-btn:hover{background:var(--g1)}
  .pag-btn.on{background:var(--black);color:var(--white);border-color:var(--black)}
  .cr-type{font-size:11px;letter-spacing:.16em;color:var(--green);margin-bottom:14px;font-weight:500}
  .cr-avatar{width:64px;height:64px;border-radius:50%;background:var(--g1);border:var(--bd);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;overflow:hidden}
  .cr-avatar img{width:100%;height:100%;object-fit:cover}
  .cr-name{font-family:var(--serif);font-size:18px;margin-bottom:14px;font-weight:600}
  .cr-spec{font-size:12px;color:var(--g4);margin-bottom:18px;line-height:1.7;font-weight:500;white-space:pre-line}
  .cr-works{display:flex;gap:4px;margin-bottom:28px}
  .cr-work{width:52px;height:52px;background:var(--g1);border:2px solid var(--g2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--g3)}
  .cr-work img{width:100%;height:100%;object-fit:cover}
  /* FOOTER */
  footer{padding:28px 40px;border-top:var(--bd-dark);display:flex;justify-content:space-between;align-items:center}
  .fl-logo{font-family:var(--serif);font-size:15px;letter-spacing:.1em;font-weight:600}
  .fl-copy{font-size:12px;color:var(--g3);font-weight:500}
  .admin-trigger{font-size:11px;color:var(--g2);background:none;border:none;cursor:pointer;font-family:var(--sans);transition:color .2s;padding:4px 8px}
  .admin-trigger:hover{color:var(--g3)}
  /* ADMIN */
  #admin-panel{display:none;background:#0f0f0e;color:#fafaf8;padding:72px 40px}
  .admin-inn{max-width:860px;margin:0 auto}
  .admin-h{font-family:var(--serif);font-size:22px;color:#fafaf8;margin-bottom:6px;font-weight:600}
  .admin-sub{font-size:13px;color:#888;margin-bottom:32px;font-weight:400;line-height:1.8}
  .arow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .arow1{margin-bottom:16px}
  .albl{display:block;font-size:11px;color:#888;margin-bottom:6px;font-weight:500}
  .ainput,.atextarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid #333;background:#181816;color:#fafaf8;font-family:var(--sans);outline:none;border-radius:0}
  .ainput:focus,.atextarea:focus{border-color:#666}
  .atextarea{height:72px;resize:none}
  .avatar-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .avatar-btn{width:80px;height:80px;border-radius:50%;border:2px dashed #333;background:#181816;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s}
  .avatar-btn:hover{border-color:#666}
  .avatar-btn.has-img{border-style:solid;border-color:#555}
  .avatar-btn img.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .avatar-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .avatar-btn span{font-size:24px;pointer-events:none}
  .avatar-note{font-size:12px;color:#666;line-height:1.7}
  .work-pickers{display:flex;gap:8px;margin-top:4px}
  .work-btn{flex:1;aspect-ratio:1;border:2px dashed #333;background:#0f0f0e;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
  .work-btn:hover{border-color:#666}
  .work-btn.has-img{border-style:solid;border-color:#555}
  .work-btn img.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .work-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .work-btn span.plus{font-size:18px;color:#444;pointer-events:none}
  .pick-clear{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #666;color:#ccc;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3;pointer-events:all;line-height:1}
  .has-img .pick-clear{display:flex}
  .asave-btn{padding:12px 32px;font-size:14px;font-weight:500;background:#fafaf8;color:#0f0f0e;border:none;cursor:pointer;font-family:var(--sans);transition:opacity .15s;margin-top:8px}
  .asave-btn:hover{opacity:.85}
  .edit-mode-bar{display:none;background:#2a1a00;border:1px solid #664400;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#ffaa44;border-radius:0}
  .cancel-btn{margin-left:12px;padding:12px 20px;font-size:13px;background:none;border:1px solid #555;color:#888;cursor:pointer;font-family:var(--sans)}
  .cancel-btn:hover{border-color:#fafaf8;color:#fafaf8}
  .entry-list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
  .entry-item{display:flex;align-items:center;gap:12px;background:#181816;border:1px solid #2a2a28;padding:10px 14px}
  .entry-thumb{width:40px;height:40px;object-fit:cover;flex-shrink:0;background:#222;border-radius:50%}
  .entry-name{font-size:13px;color:#ccc;flex:1}.entry-sub{font-size:11px;color:#555}
  .adel-btn{background:none;border:1px solid #333;color:#888;font-size:11px;padding:4px 10px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
  .adel-btn:hover{border-color:#c0392b;color:#c0392b}
  .core-badge{font-size:10px;color:#555;border:1px solid #333;padding:2px 6px;margin-left:6px}
  .divider{font-size:12px;color:#666;margin:24px 0 8px;font-weight:500}
  .close-admin-btn{margin-top:32px;font-size:13px;color:#555;background:none;border:1px solid #333;padding:8px 20px;cursor:pointer;font-family:var(--sans)}
  .close-admin-btn:hover{color:#fafaf8;border-color:#666}
  .toast{position:fixed;bottom:32px;right:32px;background:#1e5c4e;color:#fff;padding:12px 20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
  @media(max-width:768px){
    nav{padding:0 20px}.sec{padding:48px 20px}
    .cr-grid{grid-template-columns:1fr}
    .arow{grid-template-columns:1fr}
    footer{flex-direction:column;gap:12px;text-align:center}
    #admin-panel{padding:48px 20px}
  }
</style>
<script>/* goro_data.js があれば読み込む */</script>
<script src="goro_data.js" onerror=""></script>
</head>

<nav>
  <a href="goro_design_v6" class="logo">GORO DESIGN</a>
  <div class="nav-links">
    <a href="goro_cases" class="nav-link">事例一覧</a>
    <a href="goro_creators" class="nav-link on">クリエイター一覧</a>

</nav>

<section class="sec">
  <div class="inn">
    <span class="sec-ey">ALL CREATORS</span>
    <h2 class="sec-h">クリエイター一覧</h2>
    <p class="sec-sub">名前や写真をクリックすると各クリエイターの詳細ページに飛べます。</p>
    <div class="cr-grid" id="cr-grid"></div>
    <div id="pagination" style="display:flex;gap:8px;justify-content:center;margin-top:28px"></div>
  </div>
</section>

<footer>
  <span class="fl-logo">GORO DESIGN</span>
  <span class="fl-copy">Copyright 2026 gorodesign</span>
  <button class="admin-trigger" onclick="openAdmin()">管理</button>
</footer>

<div id="admin-panel">
  <div class="admin-inn">
    <h2 class="admin-h">クリエイターの管理</h2>
    <p class="admin-sub">画像はクリックして選ぶだけ。自動圧縮して保存されます。<br>登録済みのクリエイターは下の一覧から<strong style="color:#fafaf8">クリックで再編集</strong>できます。</p>
    <div class="edit-mode-bar" id="edit-mode-bar">✏️ 編集モード：<span id="edit-mode-name"></span></div>
    <div class="avatar-wrap">
      <div class="avatar-btn" id="btn-avatar">
        <span>👤</span>
        <input type="file" accept="image/*" onchange="pickAvatar(this)">
      </div>
      <p class="avatar-note">顔写真をクリックして選ぶ（なくてもOK）<br>
        <button style="margin-top:6px;font-size:11px;color:#c0392b;background:none;border:1px solid #c0392b;padding:3px 10px;cursor:pointer;font-family:var(--sans)" onclick="clearAvatar()">顔写真を取り消す</button>
      </p>
    </div>
    <div class="arow">
      <div><label class="albl">ジャンルタグ</label><input class="ainput" id="a-type" placeholder="MANGA / ILLUSTRATION / VIDEO"></div>
      <div><label class="albl">クリエイター名</label><input class="ainput" id="a-name" placeholder="例：ナガレボシ 獅子"></div>
    </div>
    <div class="arow">
      <div><label class="albl">専門・得意分野（2行まで）</label><textarea class="atextarea" id="a-spec" placeholder="例：科学・技術イラスト&#10;キャラクターデザイン"></textarea></div>
      <div><label class="albl">自己紹介文（任意）</label><textarea class="atextarea" id="a-bio" placeholder="例：大阪を拠点に活動するイラストレーターです。"></textarea></div>
    </div>
    <div class="arow">
      <div><label class="albl">Instagram URL（任意）</label><input class="ainput" id="a-insta" placeholder="https://instagram.com/xxxx"></div>
      <div><label class="albl">X(Twitter) URL（任意）</label><input class="ainput" id="a-twitter" placeholder="https://x.com/xxxx"></div>
    </div>
    <div class="arow">
      <div><label class="albl">ポートフォリオ・HP URL（任意）</label><input class="ainput" id="a-link" placeholder="https://example.com"></div>
      <div></div>
    </div>
    <div class="arow1">
      <label class="albl">作品サムネ（最大3枚・クリックして選ぶ）</label>
      <div class="work-pickers">
        <div class="work-btn" id="btn-w0"><span class="plus">＋</span><button class="pick-clear" onclick="clearWork(event,0)">×</button><input type="file" accept="image/*" onchange="pickWork(this,0)"></div>
        <div class="work-btn" id="btn-w1"><span class="plus">＋</span><button class="pick-clear" onclick="clearWork(event,1)">×</button><input type="file" accept="image/*" onchange="pickWork(this,1)"></div>
        <div class="work-btn" id="btn-w2"><span class="plus">＋</span><button class="pick-clear" onclick="clearWork(event,2)">×</button><input type="file" accept="image/*" onchange="pickWork(this,2)"></div>
      </div>
    </div>
    <button class="asave-btn" id="save-btn" onclick="saveCreator()">追加する</button>
    <button class="cancel-btn" id="cancel-btn" style="display:none" onclick="cancelEdit()">キャンセル</button>
    <p class="divider">▼ 登録済みクリエイター（コアは削除不可）</p>
    <div class="entry-list" id="manage-list"></div>
    <button class="close-admin-btn" onclick="closeAdmin()">管理を閉じる</button>
  </div>
</div>
<div class="toast" id="toast"></div>

  const btn=document.getElementById('btn-avatar');btn.classList.add('has-img');
  let im=btn.querySelector('img.preview');if(!im){im=document.createElement('img');im.className='preview';btn.insertBefore(im,btn.querySelector('input'));}
  im.src=d;btn.querySelector('span').style.display='none';
}
function clearAvatar(){
  tmp.avatar=null;const btn=document.getElementById('btn-avatar');btn.classList.remove('has-img');
  const im=btn.querySelector('img.preview');if(im)im.remove();btn.querySelector('span').style.display='';
  const fi=btn.querySelector('input[type=file]');if(fi)fi.value='';
}
async function pickWork(input,i){
  const f=input.files[0];if(!f)return;const d=await compress(f);tmp.works[i]=d;
  const btn=document.getElementById('btn-w'+i);btn.classList.add('has-img');
  let im=btn.querySelector('img.preview');if(!im){im=document.createElement('img');im.className='preview';btn.insertBefore(im,btn.querySelector('input'));}
  im.src=d;btn.querySelector('span.plus').style.display='none';
}
function clearWork(e,i){
  e.preventDefault();e.stopPropagation();tmp.works[i]=null;
  const btn=document.getElementById('btn-w'+i);btn.classList.remove('has-img');
  const im=btn.querySelector('img.preview');if(im)im.remove();btn.querySelector('span.plus').style.display='';
  const fi=btn.querySelector('input[type=file]');if(fi)fi.value='';
}

function resetForm(){
  ['a-type','a-name','a-spec','a-bio','a-insta','a-twitter','a-link'].forEach(i=>document.getElementById(i).value='');
  clearAvatar();[0,1,2].forEach(i=>clearWork({preventDefault:()=>{},stopPropagation:()=>{}},i));
}
function saveCreator(){
  if(!v('a-name')){alert('名前を入力してください');return}
  const link=v('a-link'),works=tmp.works.filter(Boolean);
  const existing = editIdx>=0 ? (editType==='core' ? getEffectiveCore(editIdx) : getExtra()[editIdx]) : null;
  const newData={
    type:v('a-type')||'ILLUSTRATION',name:v('a-name'),spec:v('a-spec'),bio:v('a-bio'),
    instagram:v('a-insta'),twitter:v('a-twitter'),
    avatar:tmp.avatar||(existing?existing.avatar:null),
    emoji:tmp.avatar?null:(existing?existing.emoji:'✏️'),
    works:works.length?works:(existing?existing.works:[]),
    link:link||null,linkText:link?'portfolio : '+link.replace(/https?:\/\//,''):''
  };
  if(editIdx>=0){
    if(editType==='core'){
      const edits=getCoreEdits();edits[editIdx]=newData;setCoreEdits(edits);
    } else {
      const arr=getExtra();arr[editIdx]=newData;if(!setExtra(arr))return;
    }
    toast('更新しました ✓');
  } else {
    const arr=getExtra();arr.push(newData);if(!setExtra(arr))return;
    toast('クリエイターを追加しました ✓');
  }
  cancelEdit();renderAll();renderManage();
}
function editCreator(type,i){
  const c = type==='core' ? getEffectiveCore(i) : getExtra()[i];
  if(!c)return;
  editIdx=i; editType=type;
  document.getElementById('a-type').value=c.type||'';
  document.getElementById('a-name').value=c.name||'';
  document.getElementById('a-spec').value=c.spec||'';
  document.getElementById('a-bio').value=c.bio||'';
  document.getElementById('a-insta').value=c.instagram||'';
  document.getElementById('a-twitter').value=c.twitter||'';
  document.getElementById('a-link').value=c.link||'';
  if(c.avatar){
    tmp.avatar=c.avatar;
    const btn=document.getElementById('btn-avatar');btn.classList.add('has-img');
    let im=btn.querySelector('img.preview');if(!im){im=document.createElement('img');im.className='preview';btn.appendChild(im);}
    im.src=c.avatar;btn.querySelector('span').style.display='none';
  }
  (c.works||[]).forEach((w,idx)=>{
    if(!w)return;tmp.works[idx]=w;
    const btn=document.getElementById('btn-w'+idx);btn.classList.add('has-img');
    let im=btn.querySelector('img.preview');if(!im){im=document.createElement('img');im.className='preview';btn.appendChild(im);}
    im.src=w;btn.querySelector('span.plus').style.display='none';
  });
  document.getElementById('edit-mode-bar').style.display='block';
  document.getElementById('edit-mode-name').textContent=c.name+(type==='core'?' (コア)':'');
  document.getElementById('save-btn').textContent='更新する';
  document.getElementById('cancel-btn').style.display='inline-block';
  document.getElementById('ap-cr-add').scrollIntoView({behavior:'smooth'});
}
function cancelEdit(){
  editIdx=-1;editType=null;resetForm();
  document.getElementById('edit-mode-bar').style.display='none';
  document.getElementById('save-btn').textContent='追加する';
  document.getElementById('cancel-btn').style.display='none';
}
function delCreator(i){const a=getExtra();a.splice(i,1);setExtra(a);if(editIdx===i&&editType==='extra'){cancelEdit();}renderAll();renderManage();toast('削除しました')}

function viewCreator(type,idx){
  const c=type==='core'?CORE[idx]:getExtra()[idx];
  if(!c)return;
  localStorage.setItem('goro_viewing_creator',JSON.stringify(c));
  window.location.href='goro_creator_detail.html';
}

const PER_PAGE=6;
let curPage=1;

function crHTML(c,type,idx){
  const av=c.avatar?`<div class="cr-avatar"><img src="${c.avatar}"></div>`:`<div class="cr-avatar">${c.emoji||'👤'}</div>`;
  const ws=c.works&&c.works.length?c.works.slice(0,3).map(w=>`<div class="cr-work"><img src="${w}" loading="lazy"></div>`).join(''):'<div class="cr-work">作</div><div class="cr-work">品</div><div class="cr-work">例</div>';
  return `<div class="cr-card" onclick="viewCreator('${type}',${idx})">${av}<p class="cr-type">${c.type}</p><p class="cr-name">${c.name}</p><p class="cr-spec">${c.spec||''}</p><div class="cr-works">${ws}</div><span class="cr-hint">詳細を見る →</span></div>`;
}
function renderAll(){
  let coreItems;
  if(typeof GORO_BAKED_DATA !== 'undefined'){
    // バックアップデータから全件表示（BAKED_DATAはcore+extraを含む）
    const bakedAll = GORO_BAKED_DATA.creators;
    const total=bakedAll.length, pages=Math.ceil(total/PER_PAGE);
    if(curPage>pages) curPage=1;
    const start=(curPage-1)*PER_PAGE;
    document.getElementById('cr-grid').innerHTML=bakedAll.slice(start,start+PER_PAGE).map((c,i)=>crHTML(c,'baked',i)).join('');
    const pg=document.getElementById('pagination');
    if(pages<=1){pg.innerHTML='';return}
    pg.innerHTML=Array.from({length:pages},(_,i)=>`<button class="pag-btn${i+1===curPage?' on':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');
    return;
  }
  coreItems=CORE.map((_,i)=>({c:getEffectiveCore(i),t:'core',i}));
  const all=[...coreItems,...getExtra().map((c,i)=>({c,t:'extra',i}))];
  const total=all.length, pages=Math.ceil(total/PER_PAGE);
  if(curPage>pages) curPage=1;
  const start=(curPage-1)*PER_PAGE;
  document.getElementById('cr-grid').innerHTML=all.slice(start,start+PER_PAGE).map(({c,t,i})=>crHTML(c,t,i)).join('');
  const pg=document.getElementById('pagination');
  if(pages<=1){pg.innerHTML='';return}
  pg.innerHTML=Array.from({length:pages},(_,i)=>`<button class="pag-btn${i+1===curPage?' on':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');
}
function goPage(n){curPage=n;renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function renderManage(){
  const ek=getExtra();
  const th=(img)=>img?`<img class="entry-thumb" src="${img}">`:`<div class="entry-thumb" style="display:flex;align-items:center;justify-content:center;font-size:16px;background:#222">👤</div>`;
  document.getElementById('manage-list').innerHTML=
    CORE.map((c,i)=>{const ec=getEffectiveCore(i);return`<div class="entry-item" style="cursor:pointer" onclick="editCreator('core',${i})" title="クリックで編集">${th(ec.avatar)}<div class="entry-name" style="flex:1"><span style="color:#fafaf8">${ec.name}</span><span class="core-badge">コア</span><div class="entry-sub">${ec.type}</div></div><span style="font-size:11px;color:#666">✏️ 編集</span></div>`}).join('')+
    ek.map((c,i)=>`<div class="entry-item" style="cursor:pointer" onclick="editCreator('extra',${i})" title="クリックで編集">${th(c.avatar)}<div class="entry-name" style="flex:1"><span style="color:#fafaf8">${c.name}</span><div class="entry-sub">${c.type}</div></div><span style="font-size:11px;color:#666;margin-right:8px">✏️ 編集</span><button class="adel-btn" onclick="event.stopPropagation();delCreator(${i})">削除</button></div>`).join('')+
    (!ek.length?'<p style="font-size:12px;color:#555;padding:8px 0">追加されたクリエイターはまだいません</p>':'');
}
function openAdmin(){const pw=prompt('管理パスワード');if(pw===PW){document.getElementById('admin-panel').style.display='block';renderManage();document.getElementById('admin-panel').scrollIntoView({behavior:'smooth'});}else if(pw!==null)alert('パスワードが違います')}
function closeAdmin(){document.getElementById('admin-panel').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
renderAll();
</script>
</body>
</html>
