<style>
  :root{--black:#0f0f0e;--white:#fafaf8;--g1:#f0efe9;--g2:#d4d1ca;--g3:#8a877f;--g4:#5a5855;--green:#1e5c4e;--green-l:#d6ede6;--bd:2px solid #d4d1ca;--bd-dark:2px solid #0f0f0e;--sans:'Noto Sans JP',sans-serif;--serif:'Shippori Mincho',serif;--w:1040px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;font-weight:500}
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:58px;background:var(--white);border-bottom:var(--bd)}
  .logo{font-family:var(--serif);font-size:16px;letter-spacing:.12em;text-decoration:none;color:var(--black);font-weight:600}
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-link{font-size:13px;color:var(--g4);text-decoration:none}.nav-link:hover{color:var(--black)}
  .nav-link.on{color:var(--black);font-weight:500}
  .sec{padding:72px 40px}.inn{max-width:var(--w);margin:0 auto}
  .sec-ey{font-size:11px;letter-spacing:.22em;color:var(--g3);display:block;margin-bottom:10px;font-weight:400}
  .sec-h{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:10px}
  .sec-sub{font-size:14px;color:var(--g4);line-height:1.9;font-weight:500;margin-bottom:44px}
  .bg1{background:var(--g1)}
  .cases-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--g2);border:var(--bd-dark)}
  .case-card{background:var(--white)}
  .case-head{padding:12px 18px;border-bottom:2px solid var(--g2);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
  .case-client{font-size:13px;font-weight:500}.case-type{font-size:11px;color:var(--g3);font-weight:500}
  .case-ba{display:grid;grid-template-columns:1fr 28px 1fr}
  .case-side-lbl{font-size:11px;letter-spacing:.12em;color:var(--g3);padding:8px 14px;border-bottom:2px solid var(--g2);font-weight:400}
  .case-side-lbl.al{color:var(--green);font-weight:500}
  .case-img{width:100%;aspect-ratio:4/3;background:var(--g1);display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--g2);position:relative;overflow:hidden}
  .case-img img{width:100%;height:100%;object-fit:contain;background:var(--white)}
  .ar-dot{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.1em;padding:3px 8px;background:var(--black);color:var(--white);font-weight:500}
  .video-link-btn{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);color:var(--white);font-size:12px;padding:9px 14px;text-decoration:none;font-weight:500;letter-spacing:.04em;display:block;text-align:center;transition:background .15s}
  .video-link-btn:hover{background:rgba(0,0,0,1)}
  .case-caption{padding:12px 14px;font-size:12px;color:var(--g4);line-height:1.7;font-weight:500;display:flex;align-items:flex-start;gap:6px}
  .chk{color:var(--green);font-size:13px;margin-top:1px;flex-shrink:0}
  .arr-col{display:flex;align-items:center;justify-content:center;border-left:2px solid var(--g2);border-right:2px solid var(--g2);font-size:16px;color:var(--g3)}
  footer{padding:28px 40px;border-top:var(--bd-dark);display:flex;justify-content:space-between;align-items:center}
  .fl-logo{font-family:var(--serif);font-size:15px;letter-spacing:.1em;font-weight:600}
  .fl-copy{font-size:12px;color:var(--g3);font-weight:500}
  .admin-trigger{font-size:11px;color:var(--g2);background:none;border:none;cursor:pointer;font-family:var(--sans);transition:color .2s;padding:4px 8px}
  .admin-trigger:hover{color:var(--g3)}
  #admin-panel{display:none;background:#0f0f0e;color:#fafaf8;padding:72px 40px}
  .admin-inn{max-width:860px;margin:0 auto}
  .admin-h{font-family:var(--serif);font-size:22px;color:#fafaf8;margin-bottom:6px;font-weight:600}
  .admin-sub{font-size:13px;color:#888;margin-bottom:32px;font-weight:400;line-height:1.8}
  .arow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .albl{display:block;font-size:11px;color:#888;margin-bottom:6px;font-weight:500}
  .ainput{width:100%;font-size:13px;padding:10px 12px;border:1px solid #333;background:#181816;color:#fafaf8;font-family:var(--sans);outline:none;border-radius:0}
  .ainput:focus{border-color:#666}
  .img-pick-btn{width:100%;border:2px dashed #333;background:#0f0f0e;cursor:pointer;position:relative;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:border-color .2s}
  .img-pick-btn:hover{border-color:#666}
  .img-pick-btn.has-img{border-style:solid;border-color:#555}
  .img-pick-btn img.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111;pointer-events:none}
  .img-pick-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .pick-icon{font-size:24px;color:#555;pointer-events:none;z-index:1}
  .pick-label{font-size:11px;color:#555;pointer-events:none;z-index:1;text-align:center;line-height:1.5}
  .pick-overlay{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);padding:5px;font-size:10px;color:#aaa;text-align:center;pointer-events:none;z-index:2}
  .pick-clear{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #666;color:#ccc;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:3;pointer-events:all;line-height:1}
  .img-pick-btn.has-img .pick-clear{display:flex}
  .asave-btn{padding:12px 32px;font-size:14px;font-weight:500;background:#fafaf8;color:#0f0f0e;border:none;cursor:pointer;font-family:var(--sans);transition:opacity .15s;margin-top:8px}
  .asave-btn:hover{opacity:.85}
  .edit-mode-bar{display:none;background:#2a1a00;border:1px solid #664400;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#ffaa44}
  .cancel-edit-btn{margin-left:12px;padding:12px 20px;font-size:13px;background:none;border:1px solid #555;color:#888;cursor:pointer;font-family:var(--sans)}
  .cancel-edit-btn:hover{border-color:#fafaf8;color:#fafaf8}
  .entry-list{display:flex;flex-direction:column;gap:6px;margin-top:16px}
  .entry-item{display:flex;align-items:center;gap:12px;background:#181816;border:1px solid #2a2a28;padding:10px 14px}
  .entry-thumb{width:40px;height:40px;object-fit:cover;flex-shrink:0;background:#222}
  .entry-name{font-size:13px;color:#ccc;flex:1}.entry-sub{font-size:11px;color:#555}
  .adel-btn{background:none;border:1px solid #333;color:#888;font-size:11px;padding:4px 10px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
  .adel-btn:hover{border-color:#c0392b;color:#c0392b}
  .core-badge{font-size:10px;color:#555;border:1px solid #333;padding:2px 6px;margin-left:6px}
  .divider{font-size:12px;color:#666;margin:24px 0 8px;font-weight:500}
  .close-admin-btn{margin-top:32px;font-size:13px;color:#555;background:none;border:1px solid #333;padding:8px 20px;cursor:pointer;font-family:var(--sans)}
  .close-admin-btn:hover{color:#fafaf8;border-color:#666}
  .toast{position:fixed;bottom:32px;right:32px;background:#1e5c4e;color:#fff;padding:12px 20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
  @media(max-width:768px){
    nav{padding:0 20px}.sec{padding:48px 20px}
    .cases-grid{grid-template-columns:1fr}
    .case-ba{grid-template-columns:1fr}.arr-col{display:none}
    .arow{grid-template-columns:1fr}
    footer{flex-direction:column;gap:12px;text-align:center}
    #admin-panel{padding:48px 20px}
  }
</style>

    <div class="edit-mode-bar" id="edit-mode-bar"></div>

          <button class="pick-clear" onclick="clearPick(event,'aimg')">×</button>

      <input class="ainput" id="a-avideo" placeholder="YouTubeのURLを貼り付け（例：https://youtu.be/xxxx）">

<script>
const CORE=[
  {client:"イラストレーター823 様",type:"名刺 × キャラクターアニメ",beforeImg:"images/case1_before.jpg",beforeLabel:"普段の名刺",afterImg:"images/case1_after.jpg",afterLabel:"スマホをかざすとご自身のキャラクターが動くオリジナルアニメが流れる"},
  {client:"株式会社ネオマチ 様",type:"カード × ゲームキャラクターAR",beforeImg:"images/case2_before.jpg",beforeLabel:"ゲームの販促カード",afterImg:"images/case2_after.jpg",afterLabel:"ゲームタイトルのキャラクターが画面に飛び出すAR体験"},
  {client:"似顔絵師・四季彩画家 神生 様",type:"名刺 × 自己紹介動画",beforeImg:"images/case3_before.jpg",beforeLabel:"普段の名刺",afterImg:"images/case3_after.jpg",afterLabel:"ご本人様が自己紹介する動画が流れる。名刺を渡すだけで人柄まで伝わる"},
  {client:"ギャラリーゴロー 溝口聡志",type:"名刺 × 自己紹介AR",beforeImg:"images/case4_before.jpg",beforeLabel:"普段の名刺",afterImg:"images/case4_after.jpg",afterLabel:"名刺にかざすと本人が登場。ギャラリーゴローの活動をその場で紹介できる"}
];
const PW="goro2026",KEY="goro_extra_cases",CORE_KEY="goro_core_case_edits";
let tmp={bimg:null,aimg:null};
let editIdx=-1, editType=null;
function getExtra(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function setExtra(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch{alert('保存容量が不足しています。');return false}}
function getCoreEdits(){try{return JSON.parse(localStorage.getItem(CORE_KEY)||'[]')}catch{return[]}}
function setCoreEdits(a){localStorage.setItem(CORE_KEY,JSON.stringify(a))}
function getEffectiveCore(i){const e=getCoreEdits();return e[i]?{...CORE[i],...e[i]}:CORE[i]}
function v(id){return document.getElementById(id).value.trim()}

async function compress(file){return new Promise(r=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=600,ra=Math.min(M/img.naturalWidth,M/img.naturalHeight,1);const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*ra);c.height=Math.round(img.naturalHeight*ra);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',0.72))};img.src=u})}
async function pickImg(input,key){
  const f=input.files[0];if(!f)return;
  const d=await compress(f);tmp[key]=d;
  const btn=document.getElementById('btn-'+key);btn.classList.add('has-img');
  let im=btn.querySelector('img.preview');if(!im){im=document.createElement('img');im.className='preview';btn.insertBefore(im,btn.querySelector('input'));}
  im.src=d;btn.querySelectorAll('.pick-icon,.pick-label').forEach(e=>e.style.display='none');
  const ov=btn.querySelector('.pick-overlay')||document.createElement('div');ov.className='pick-overlay';ov.textContent='クリックで変更';if(!btn.querySelector('.pick-overlay'))btn.appendChild(ov);
}
function clearPick(e,key){
  e.preventDefault();e.stopPropagation();tmp[key]=null;
  const btn=document.getElementById('btn-'+key);btn.classList.remove('has-img');
  const im=btn.querySelector('img.preview');if(im)im.remove();
  const ov=btn.querySelector('.pick-overlay');if(ov)ov.remove();
  btn.querySelectorAll('.pick-icon,.pick-label').forEach(e=>e.style.display='');
  const fi=btn.querySelector('input[type=file]');if(fi)fi.value='';
}

// 既存画像をピッカーにプレビューとして表示（ファイルパスまたはbase64）
function showPickPreview(key, src){
  if(!src)return;
  const btn=document.getElementById('btn-'+key);
  btn.classList.add('has-img');
  let im=btn.querySelector('img.preview');
  if(!im){im=document.createElement('img');im.className='preview';btn.insertBefore(im,btn.querySelector('input'));}
  im.src=src;
  btn.querySelectorAll('.pick-icon,.pick-label').forEach(e=>e.style.display='none');
  const ov=btn.querySelector('.pick-overlay')||document.createElement('div');
  ov.className='pick-overlay';ov.textContent='クリックで変更';
  if(!btn.querySelector('.pick-overlay'))btn.appendChild(ov);
}

function saveCase(){
  if(!v('a-client')){alert('クライアント名を入力してください');return}
  const existing = editIdx>=0 ? (editType==='core' ? getEffectiveCore(editIdx) : getExtra()[editIdx]) : null;
  const bImg = tmp.bimg || (existing ? existing.beforeImg : null);
  const aImg = tmp.aimg || (existing ? existing.afterImg : null);
  if(!bImg){alert('Before画像を選んでください');return}
  if(!aImg&&!v('a-avideo')&&!existing?.afterVideo){alert('After画像か動画URLを入力してください');return}
  const newData={
    client:v('a-client'),type:v('a-type')||'名刺 × AR',
    beforeImg:bImg,beforeLabel:v('a-blbl')||'普段の名刺',
    afterImg:aImg,afterVideo:v('a-avideo')||(existing?existing.afterVideo:null)||null,
    afterLabel:v('a-albl')||'AR体験'
  };
  if(editIdx>=0){
    if(editType==='core'){const edits=getCoreEdits();edits[editIdx]=newData;setCoreEdits(edits);}
    else{const arr=getExtra();arr[editIdx]=newData;if(!setExtra(arr))return;}
    toast('更新しました ✓');
  } else {
    if(!tmp.bimg){alert('Before画像を選んでください');return}
    const arr=getExtra();arr.push(newData);if(!setExtra(arr))return;
    toast('事例を追加しました ✓');
  }
  cancelEdit();renderAll();renderManage();
}
function editCase(type,i){
  const c = type==='core' ? getEffectiveCore(i) : getExtra()[i];
  if(!c)return;
  editIdx=i;editType=type;
  document.getElementById('a-client').value=c.client||'';
  document.getElementById('a-type').value=c.type||'';
  document.getElementById('a-blbl').value=c.beforeLabel||'普段の名刺';
  document.getElementById('a-albl').value=c.afterLabel||'';
  document.getElementById('a-avideo').value=c.afterVideo||'';
  showPickPreview('bimg',c.beforeImg);
  showPickPreview('aimg',c.afterImg);
  // 編集モード表示
  const bar=document.getElementById('edit-mode-bar');
  if(bar){bar.style.display='block';bar.textContent='✏️ 編集モード：'+c.client+(type==='core'?' (コア)':'');}
  const sb=document.getElementById('save-btn');if(sb)sb.textContent='更新する';
  const cb=document.getElementById('cancel-btn');if(cb)cb.style.display='inline-block';
  document.getElementById('admin-panel').scrollIntoView({behavior:'smooth'});
}
function cancelEdit(){
  editIdx=-1;editType=null;
  ['a-client','a-type','a-albl','a-avideo'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('a-blbl').value='普段の名刺';
  clearPick({preventDefault:()=>{},stopPropagation:()=>{}},'bimg');
  clearPick({preventDefault:()=>{},stopPropagation:()=>{}},'aimg');
  const bar=document.getElementById('edit-mode-bar');if(bar)bar.style.display='none';
  const sb=document.getElementById('save-btn');if(sb)sb.textContent='追加する';
  const cb=document.getElementById('cancel-btn');if(cb)cb.style.display='none';
}
function delCase(i){const a=getExtra();a.splice(i,1);setExtra(a);if(editIdx===i&&editType==='extra'){cancelEdit();}renderAll();renderManage();toast('削除しました')}
function afterMedia(c){
  const img=`<img src="${c.afterImg}" loading="lazy">`;
  if(c.afterVideo) return img+`<a href="${c.afterVideo}" target="_blank" class="video-link-btn">▶ 動画を見る →</a>`;
  return img;
}
function caseHTML(c){
  return `<div class="case-card">
    <div class="case-head"><span class="case-client">${c.client}</span><span class="case-type">${c.type}</span></div>
    <div class="case-ba">
      <div><div class="case-side-lbl">Before</div><div class="case-img"><img src="${c.beforeImg}" loading="lazy"></div><div class="case-caption">${c.beforeLabel}</div></div>
      <div class="arr-col">→</div>
      <div><div class="case-side-lbl al">After AR</div><div class="case-img" style="position:relative">${afterMedia(c)}${!c.afterVideo?'<span class="ar-dot">▶ AR</span>':''}</div><div class="case-caption"><span class="chk">✓</span><span>${c.afterLabel}</span></div></div>
    </div>
  </div>`
}
function renderAll(){
  let allCases;
  if(typeof GORO_BAKED_DATA !== 'undefined'){
    allCases = GORO_BAKED_DATA.cases;
  } else {
    const effectiveCore=CORE.map((_,i)=>getEffectiveCore(i));
    allCases=[...effectiveCore,...getExtra()];
  }
  document.getElementById('cases-grid').innerHTML=allCases.map(caseHTML).join('');
}
function renderManage(){
  const ec=getExtra();
  document.getElementById('manage-list').innerHTML=
    CORE.map((c,i)=>{const ec2=getEffectiveCore(i);return`<div class="entry-item" style="cursor:pointer" onclick="editCase('core',${i})" title="クリックで編集"><img class="entry-thumb" src="${ec2.beforeImg}"><div class="entry-name" style="flex:1"><span style="color:#fafaf8">${ec2.client}</span><span class="core-badge">コア</span><div class="entry-sub">${ec2.type}</div></div><span style="font-size:11px;color:#666">✏️ 編集</span></div>`}).join('')+
    ec.map((c,i)=>`<div class="entry-item" style="cursor:pointer" onclick="editCase('extra',${i})" title="クリックで編集"><img class="entry-thumb" src="${c.beforeImg}"><div class="entry-name" style="flex:1"><span style="color:#fafaf8">${c.client}</span><div class="entry-sub">${c.type}</div></div><span style="font-size:11px;color:#666;margin-right:8px">✏️ 編集</span><button class="adel-btn" onclick="event.stopPropagation();delCase(${i})">削除</button></div>`).join('')+
    (!ec.length?'<p style="font-size:12px;color:#555;padding:8px 0">追加された事例はまだありません</p>':'');
}
function openAdmin(){const pw=prompt('管理パスワード');if(pw===PW){document.getElementById('admin-panel').style.display='block';renderManage();document.getElementById('admin-panel').scrollIntoView({behavior:'smooth'});}else if(pw!==null)alert('パスワードが違います')}
function closeAdmin(){document.getElementById('admin-panel').style.display='none';cancelEdit();window.scrollTo({top:0,behavior:'smooth'})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
renderAll();
</script>
</body>
</html>
